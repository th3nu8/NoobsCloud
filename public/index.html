<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VMStream</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="wrap">
    <h1>VMStream</h1>
    <p class="sub">Stream an Android instance from your browser. 1 credit / minute.</p>

    <div class="card">
      <div class="tabs">
        <button id="tabLogin" class="tab active">Log in</button>
        <button id="tabRegister" class="tab">Sign up</button>
      </div>

      <form id="loginForm">
        <input name="username" placeholder="Username" required>
        <input name="password" type="password" placeholder="Password" required>
        <button type="submit">Log in</button>
      </form>

      <form id="registerForm" style="display:none">
        <input name="username" placeholder="Username" required>
        <input name="password" type="password" placeholder="Password (6+ chars)" required>
        <button type="submit">Create account</button>
      </form>

      <p id="error" class="error"></p>
    </div>
  </div>
  <script src="/js/app.js"></script>
  <script>
    tabLogin.onclick = () => { tabLogin.classList.add('active'); tabRegister.classList.remove('active'); loginForm.style.display='block'; registerForm.style.display='none'; };
    tabRegister.onclick = () => { tabRegister.classList.add('active'); tabLogin.classList.remove('active'); registerForm.style.display='block'; loginForm.style.display='none'; };

    loginForm.onsubmit = async (e) => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(loginForm));
      const r = await api('/api/auth/login', body);
      if (r.ok) location.href = '/dashboard.html'; else error.textContent = r.error;
    };
    registerForm.onsubmit = async (e) => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(registerForm));
      const r = await api('/api/auth/register', body);
      if (r.ok) location.href = r.isOwner ? '/owner.html' : '/dashboard.html'; else error.textContent = r.error;
    };
  </script>
</body>
</html>
