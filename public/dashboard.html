<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VMStream - Dashboard</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1>VMStream</h1>
      <div>
        <span id="creditsDisplay" class="credits">-- credits</span>
        <a href="/owner.html" id="ownerLink" style="display:none">Owner dashboard</a>
        <button id="logoutBtn">Log out</button>
      </div>
    </div>

    <div class="card">
      <div id="pickGameState" style="display:none">
        <p>Choose the one game your account will be locked to. <strong>This can't be changed later</strong> without asking the owner.</p>
        <select id="gameSelect"></select>
        <button id="lockGameBtn">Lock in this game</button>
      </div>

      <div id="idleState" style="display:none">
        <p>Your game: <strong id="lockedGameName"></strong></p>
        <button id="startBtn">Start streaming (1 credit/min)</button>
      </div>

      <div id="activeState" style="display:none">
        <p>Session active - <span id="minutesBilled">0</span> min billed.</p>
        <iframe id="streamFrame" style="width:100%;height:600px;border:1px solid #333;"></iframe>
        <br>
        <button id="stopBtn">Stop session</button>
      </div>

      <p id="error" class="error"></p>
    </div>
  </div>
  <script src="/js/app.js"></script>
  <script>
    let currentInstanceId = null;
    let gamesCatalog = [];

    (async function init() {
      const me = await fetch('/api/me').then(r => r.json());
      if (!me.loggedIn) return location.href = '/';
      creditsDisplay.textContent = `${me.user.credits} credits`;
      if (me.user.is_owner) ownerLink.style.display = 'inline';

      const { games } = await fetch('/api/games').then(r => r.json());
      gamesCatalog = games;

      if (!me.user.locked_game_id) {
        gameSelect.innerHTML = games.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
        pickGameState.style.display = 'block';
      } else {
        const g = games.find(g => g.id === me.user.locked_game_id);
        lockedGameName.textContent = g ? g.name : me.user.locked_game_id;
        idleState.style.display = 'block';
      }
    })();

    logoutBtn.onclick = async () => { await api('/api/auth/logout', {}); location.href = '/'; };

    lockGameBtn.onclick = async () => {
      const r = await api('/api/games/lock', { gameId: gameSelect.value });
      if (!r.ok) { error.textContent = r.error; return; }
      pickGameState.style.display = 'none';
      const g = gamesCatalog.find(g => g.id === r.gameId);
      lockedGameName.textContent = g ? g.name : r.gameId;
      idleState.style.display = 'block';
    };

    startBtn.onclick = async () => {
      startBtn.disabled = true;
      startBtn.textContent = 'Starting instance... this can take a minute';
      const r = await api('/api/stream/start', {});
      startBtn.disabled = false;
      startBtn.textContent = 'Start streaming (1 credit/min)';
      if (!r.ok) { error.textContent = r.error; return; }
      currentInstanceId = r.instanceId;
      streamFrame.src = r.streamUrl;
      idleState.style.display = 'none';
      activeState.style.display = 'block';
    };

    stopBtn.onclick = async () => {
      await api('/api/stream/stop', { instanceId: currentInstanceId });
      streamFrame.src = '';
      activeState.style.display = 'none';
      idleState.style.display = 'block';
      const me = await fetch('/api/me').then(r => r.json());
      creditsDisplay.textContent = `${me.user.credits} credits`;
    };
  </script>
</body>
</html>
